    <script>
      // =========================================================================
      // 1. GLOBAL STATE & HIGH-VISIBILITY ALPINE PALETTE CONFIGURATION
      // =========================================================================
      const METERS_TO_FEET = 3.28084;
      const METERS_TO_MILES = 0.000621371;

      const TIER_CONFIG = {
        main: {
          label: 'Main Road',
          colorHex: '#FFE600',
          colorInt: 0xffe600,
          rgba: 'rgba(255,230,0,0.40)',
          radius: 0.78
        },
        secondary: {
          label: 'ATV / Secondary',
          colorHex: '#FF2E4C',
          colorInt: 0xff2e4c,
          rgba: 'rgba(255,46,76,0.40)',
          radius: 0.54
        }
      };

      const state = {
        renderMode: 'diorama', // 'diorama' | 'satellite'
        surfaceStyle: 'hybrid', // 'hybrid' | 'topo'
        exaggeration: 1.8,
        layers: { main: true, secondary: true, waypoints: true },
        gpxData: null,
        selectedItem: null,
        hoveredMesh: null,
        isRealDataLoaded: false
      };

      function classifyTrackTier(name) {
        const lower = (name || '').toLowerCase();
        if (
          lower.includes('shop road') ||
          lower.includes('big valley') ||
          lower.includes('171 main') ||
          lower.includes('big ridge northeast') ||
          lower.includes('big ridge southwest') ||
          lower === 'turkey road'
        ) {
          return 'main';
        }
        return 'secondary';
      }

      function getWaypointCategory(name) {
        const lower = (name || '').toLowerCase();
        if (lower.includes('gate')) return 'gate';
        if (lower === 'shop' || lower.includes('cabin') || lower.includes('camp')) return 'shop';
        if (lower.includes('stand') || lower.includes('dollhouse')) return 'stand';
        return 'landmark';
      }

      function getWaypointBadgeSVG(category) {
        if (category === 'stand') {
          return `<svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14l-1.5 6h-11z"/><path d="M7.5 10L5 21"/><path d="M16.5 10L19 21"/><path d="M6.3 15.5h11.4"/><path d="M9.5 6.5h5"/></svg>`;
        }
        if (category === 'gate') {
          return `<svg class="w-3.5 h-3.5 text-rose-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16"/><path d="M4 8h16v3H4z"/><path d="M4 15l6-4"/></svg>`;
        }
        if (category === 'shop') {
          return `<svg class="w-3.5 h-3.5 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>`;
        }
        return `<span class="w-2 h-2 rounded-full bg-sky-400 inline-block shrink-0"></span>`;
      }

      // =========================================================================
      // 2. GPX PARSER & GEODESIC MATH
      // =========================================================================
      function haversineMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = d => (d * Math.PI) / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function parseGPXString(xmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) {
          throw new Error('Invalid GPX XML format.');
        }

        const metaName = doc.querySelector('metadata > name')?.textContent?.trim() || "Tony's Land";
        const waypoints = [];
        doc.querySelectorAll('wpt').forEach((wpt, idx) => {
          const lat = parseFloat(wpt.getAttribute('lat'));
          const lon = parseFloat(wpt.getAttribute('lon'));
          const ele = parseFloat(wpt.querySelector('ele')?.textContent || 'NaN');
          const name = wpt.querySelector('name')?.textContent?.trim() || `Waypoint ${idx + 1}`;
          if (!isNaN(lat) && !isNaN(lon)) {
            waypoints.push({
              id: `wpt-${idx}`,
              name,
              lat,
              lon,
              ele: isNaN(ele) ? null : ele,
              category: getWaypointCategory(name)
            });
          }
        });

        const tracks = [];
        doc.querySelectorAll('trk').forEach((trk, tIdx) => {
          const name = trk.querySelector('name')?.textContent?.trim() || `Trail ${tIdx + 1}`;
          const tier = classifyTrackTier(name);
          const points = [];
          let cumDist = 0;
          let gain = 0;
          let loss = 0;
          let minEle = Infinity;
          let maxEle = -Infinity;

          trk.querySelectorAll('trkpt').forEach(pt => {
            const lat = parseFloat(pt.getAttribute('lat'));
            const lon = parseFloat(pt.getAttribute('lon'));
            const ele = parseFloat(pt.querySelector('ele')?.textContent || '200');
            if (!isNaN(lat) && !isNaN(lon)) {
              if (points.length > 0) {
                const prev = points[points.length - 1];
                cumDist += haversineMeters(prev.lat, prev.lon, lat, lon);
                const dEle = ele - prev.ele;
                if (dEle > 0.3) gain += dEle;
                else if (dEle < -0.3) loss += Math.abs(dEle);
              }
              if (ele < minEle) minEle = ele;
              if (ele > maxEle) maxEle = ele;
              points.push({ lat, lon, ele, dist: cumDist });
            }
          });

          if (points.length > 1) {
            tracks.push({
              id: `trk-${tIdx}`,
              name,
              tier,
              points,
              totalDist: cumDist,
              gain,
              loss,
              minEle: minEle === Infinity ? 180 : minEle,
              maxEle: maxEle === -Infinity ? 260 : maxEle
            });
          }
        });

        let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
        let globalMinEle = Infinity, globalMaxEle = -Infinity;

        tracks.forEach(t => {
          t.points.forEach(p => {
            if (p.lat < minLat) minLat = p.lat;
            if (p.lat > maxLat) maxLat = p.lat;
            if (p.lon < minLon) minLon = p.lon;
            if (p.lon > maxLon) maxLon = p.lon;
            if (p.ele < globalMinEle) globalMinEle = p.ele;
            if (p.ele > globalMaxEle) globalMaxEle = p.ele;
          });
        });

        waypoints.forEach(w => {
          if (w.lat < minLat) minLat = w.lat;
          if (w.lat > maxLat) maxLat = w.lat;
          if (w.lon < minLon) minLon = w.lon;
          if (w.lon > maxLon) maxLon = w.lon;
        });

        const latPad = Math.max((maxLat - minLat) * 0.14, 0.0025);
        const lonPad = Math.max((maxLon - minLon) * 0.14, 0.0025);
        minLat -= latPad;
        maxLat += latPad;
        minLon -= lonPad;
        maxLon += lonPad;

        return {
          title: metaName,
          tracks,
          waypoints,
          bounds: {
            minLat, maxLat, minLon, maxLon,
            centerLat: (minLat + maxLat) / 2,
            centerLon: (minLon + maxLon) / 2,
            minEle: globalMinEle === Infinity ? 150 : globalMinEle,
            maxEle: globalMaxEle === -Infinity ? 290 : globalMaxEle
          }
        };
      }

      // =========================================================================
      // 3. THREE.JS 3D RELIEF DIORAMA ENGINE
      // =========================================================================
      let scene, camera, renderer, dioramaGroup, terrainMesh, skirtMesh, basePlinthMesh;
      let roadMeshes = [];
      let waypointMeshes = [];
      let scrubMarkerMesh = null;
      let raycaster = null;
      let pointer = null;

      const BLOCK_SIZE = 240;
      const GRID_RES = 128;
      let elevationGrid = new Float32Array((GRID_RES + 1) * (GRID_RES + 1));
      let blockWidth = BLOCK_SIZE;
      let blockDepth = BLOCK_SIZE;
      let metersPerWorldUnit = 13.5;
      let activeTexture = null;

      const orbit = {
        theta: -0.42,
        phi: 0.88,
        radius: 315,
        target: null,
        isDragging: false,
        dragMode: 'rotate',
        prevX: 0,
        prevY: 0,
        downX: 0,
        downY: 0
      };

      function ensureThreeLoaded() {
        if (typeof window.THREE !== 'undefined') return Promise.resolve();
        const cdnUrls = [
          'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
          'https://unpkg.com/three@0.128.0/build/three.min.js',
          'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
        ];
        return new Promise((resolve, reject) => {
          let idx = 0;
          const tryNext = () => {
            if (typeof window.THREE !== 'undefined') return resolve();
            if (idx >= cdnUrls.length) return reject(new Error('Three.js failed to load from all CDNs.'));
            const s = document.createElement('script');
            s.src = cdnUrls[idx++];
            s.onload = () => (typeof window.THREE !== 'undefined' ? resolve() : tryNext());
            s.onerror = tryNext;
            document.head.appendChild(s);
          };
          tryNext();
        });
      }

      function updateCameraFromOrbit() {
        if (!camera || !orbit.target) return;
        orbit.phi = Math.max(0.18, Math.min(Math.PI / 2 - 0.05, orbit.phi));
        orbit.radius = Math.max(85, Math.min(620, orbit.radius));
        const sinPhi = Math.sin(orbit.phi);
        camera.position.x = orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta);
        camera.position.y = orbit.target.y + orbit.radius * Math.cos(orbit.phi);
        camera.position.z = orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta);
        camera.lookAt(orbit.target);
      }

      function initThreeEngine() {
        raycaster = new THREE.Raycaster();
        pointer = new THREE.Vector2();
        orbit.target = new THREE.Vector3(0, 12, 0);

        const container = document.getElementById('three-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f0d);
        scene.fog = new THREE.FogExp2(0x0b0f0d, 0.00115);

        camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 1, 2000);
        updateCameraFromOrbit();

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // Studio + Warm Sunlight Rig
        scene.add(new THREE.AmbientLight(0xdbeafe, 0.52));

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.32);
        sunLight.position.set(170, 260, 140);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 40;
        sunLight.shadow.camera.far = 700;
        const d = 180;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const rimLight = new THREE.DirectionalLight(0x34d399, 0.35);
        rimLight.position.set(-180, 120, -160);
        scene.add(rimLight);

        // Studio Floor
        const floorGeo = new THREE.PlaneGeometry(1800, 1800);
        const floorMat = new THREE.MeshStandardMaterial({
          color: 0x090d0b,
          roughness: 0.92,
          metalness: 0.05
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -24;
        floor.receiveShadow = true;
        scene.add(floor);

        dioramaGroup = new THREE.Group();
        scene.add(dioramaGroup);

        // Elevation Scrubber Sphere
        const scrubGeo = new THREE.SphereGeometry(1.8, 16, 16);
        const scrubMat = new THREE.MeshBasicMaterial({ color: 0x10b981 });
        scrubMarkerMesh = new THREE.Mesh(scrubGeo, scrubMat);
        scrubMarkerMesh.visible = false;
        dioramaGroup.add(scrubMarkerMesh);

        setupOrbitControls(renderer.domElement);

        window.addEventListener('resize', () => {
          if (!renderer || !camera) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
          if (state.selectedItem && state.selectedItem.type === 'track') {
            drawElevationChart(state.selectedItem.data);
          }
        });
      }

      let autoRotate = false;
      function toggleAutoRotate() {
        autoRotate = !autoRotate;
        const btn = document.getElementById('btn-auto-rotate');
        btn.textContent = autoRotate ? 'Spin: On' : 'Spin: Off';
        btn.classList.toggle('text-emerald-400', autoRotate);
      }

      function setupOrbitControls(domElement) {
        domElement.addEventListener('contextmenu', e => e.preventDefault());

        domElement.addEventListener('pointerdown', e => {
          orbit.isDragging = true;
          orbit.prevX = e.clientX;
          orbit.prevY = e.clientY;
          orbit.downX = e.clientX;
          orbit.downY = e.clientY;
          orbit.dragMode = e.button === 2 || e.shiftKey ? 'pan' : 'rotate';
          domElement.setPointerCapture(e.pointerId);
        });

        domElement.addEventListener('pointermove', e => {
          if (!orbit.isDragging) {
            handleHoverRaycast(e);
            return;
          }
          const dx = e.clientX - orbit.prevX;
          const dy = e.clientY - orbit.prevY;
          orbit.prevX = e.clientX;
          orbit.prevY = e.clientY;

          if (orbit.dragMode === 'rotate') {
            orbit.theta -= dx * 0.0065;
            orbit.phi -= dy * 0.0065;
          } else {
            const panSpeed = orbit.radius * 0.0012;
            const rightX = Math.cos(orbit.theta);
            const rightZ = -Math.sin(orbit.theta);
            orbit.target.x -= dx * panSpeed * rightX;
            orbit.target.z -= dx * panSpeed * rightZ;
            orbit.target.x += dy * panSpeed * Math.sin(orbit.theta);
            orbit.target.z += dy * panSpeed * Math.cos(orbit.theta);
          }
          updateCameraFromOrbit();
        });

        domElement.addEventListener('pointerup', e => {
          orbit.isDragging = false;
          try { domElement.releasePointerCapture(e.pointerId); } catch (_) {}
          const dist = Math.hypot(e.clientX - orbit.downX, e.clientY - orbit.downY);
          if (dist < 5) {
            handleClickRaycast(e);
          }
        });

        domElement.addEventListener(
          'wheel',
          e => {
            e.preventDefault();
            orbit.radius += e.deltaY * 0.22;
            updateCameraFromOrbit();
          },
          { passive: false }
        );
      }

      function handleHoverRaycast(e) {
        if (!terrainMesh || !raycaster) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const targets = [
          ...roadMeshes.filter(m => m.visible),
          ...waypointMeshes.filter(m => m.visible)
        ];
        const hits = raycaster.intersectObjects(targets, true);
        if (hits.length > 0) {
          renderer.domElement.style.cursor = 'pointer';
        } else {
          renderer.domElement.style.cursor = orbit.isDragging ? 'grabbing' : 'grab';
        }
      }

      function handleClickRaycast(e) {
        if (!terrainMesh || !raycaster) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const targets = [
          ...waypointMeshes.filter(m => m.visible),
          ...roadMeshes.filter(m => m.visible)
        ];
        const hits = raycaster.intersectObjects(targets, true);
        if (hits.length > 0) {
          let obj = hits[0].object;
          while (obj && !obj.userData?.itemType) {
            obj = obj.parent;
          }
          if (obj && obj.userData) {
            if (obj.userData.itemType === 'track') {
              selectTrack(obj.userData.track);
            } else if (obj.userData.itemType === 'waypoint') {
              selectWaypoint(obj.userData.waypoint);
            }
          }
        }
      }

      // =========================================================================
      // 4. REAL-WORLD DEM + SATELLITE TILE FETCHER (WITH PROCEDURAL FALLBACK)
      // =========================================================================
      function lon2tile(lon, zoom) {
        return ((lon + 180) / 360) * Math.pow(2, zoom);
      }

      function lat2tile(lat, zoom) {
        const rad = (lat * Math.PI) / 180;
        return (
          ((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) *
          Math.pow(2, zoom)
        );
      }

      function loadImageCORS(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Tile load failed'));
          img.src = url;
        });
      }

      async function buildTerrainFromGPX(gpxData) {
        const { minLat, maxLat, minLon, maxLon, centerLat } = gpxData.bounds;
        const latMeters = (maxLat - minLat) * 111320;
        const lonMeters = (maxLon - minLon) * 111320 * Math.cos((centerLat * Math.PI) / 180);
        const aspect = lonMeters / Math.max(latMeters, 1);

        if (aspect >= 1) {
          blockWidth = BLOCK_SIZE;
          blockDepth = BLOCK_SIZE / aspect;
        } else {
          blockDepth = BLOCK_SIZE;
          blockWidth = BLOCK_SIZE * aspect;
        }
        metersPerWorldUnit = Math.max(lonMeters, latMeters) / BLOCK_SIZE;

        // First synthesize immediate IDW + multi-octave ridge terrain from GPX tracks so 3D renders instantly
        synthesizeProceduralElevation(gpxData);
        const fallbackCanvas = generateProceduralTextureCanvas(gpxData, state.surfaceStyle);
        activeTexture = new THREE.CanvasTexture(fallbackCanvas);
        activeTexture.anisotropy = 4;

        rebuildDioramaMesh();

        // Attempt live AWS Terrarium DEM + ESRI World Imagery upgrade in background
        try {
          const zoom = 14;
          const xMinF = lon2tile(minLon, zoom);
          const xMaxF = lon2tile(maxLon, zoom);
          const yMinF = lat2tile(maxLat, zoom);
          const yMaxF = lat2tile(minLat, zoom);

          const x0 = Math.floor(xMinF);
          const x1 = Math.floor(xMaxF);
          const y0 = Math.floor(yMinF);
          const y1 = Math.floor(yMaxF);

          const tilesX = x1 - x0 + 1;
          const tilesY = y1 - y0 + 1;

          if (tilesX <= 5 && tilesY <= 5) {
            const tileSize = 256;
            const demCanvas = document.createElement('canvas');
            demCanvas.width = tilesX * tileSize;
            demCanvas.height = tilesY * tileSize;
            const demCtx = demCanvas.getContext('2d');

            const satCanvas = document.createElement('canvas');
            satCanvas.width = tilesX * tileSize;
            satCanvas.height = tilesY * tileSize;
            const satCtx = satCanvas.getContext('2d');

            const jobs = [];
            for (let tx = x0; tx <= x1; tx++) {
              for (let ty = y0; ty <= y1; ty++) {
                const dx = (tx - x0) * tileSize;
                const dy = (ty - y0) * tileSize;
                const demUrl = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${zoom}/${tx}/${ty}.png`;
                const satUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ty}/${tx}`;

                jobs.push(
                  loadImageCORS(demUrl).then(img => demCtx.drawImage(img, dx, dy))
                );
                jobs.push(
                  loadImageCORS(satUrl).then(img => satCtx.drawImage(img, dx, dy))
                );
              }
            }

            await Promise.all(jobs);

            const demPixels = demCtx.getImageData(0, 0, demCanvas.width, demCanvas.height).data;
            const sampleDemPixel = (px, py) => {
              const cx = Math.min(demCanvas.width - 1, Math.max(0, px));
              const cy = Math.min(demCanvas.height - 1, Math.max(0, py));
              const pIdx = (cy * demCanvas.width + cx) * 4;
              return demPixels[pIdx] * 256 + demPixels[pIdx + 1] + demPixels[pIdx + 2] / 256 - 32768;
            };

            const rawGrid = new Float32Array((GRID_RES + 1) * (GRID_RES + 1));

            for (let iz = 0; iz <= GRID_RES; iz++) {
              const v = iz / GRID_RES;
              const lat = maxLat - v * (maxLat - minLat);
              const tyF = lat2tile(lat, zoom);
              const pyF = (tyF - y0) * tileSize;
              const py0 = Math.floor(pyF);
              const fy = pyF - py0;

              for (let ix = 0; ix <= GRID_RES; ix++) {
                const u = ix / GRID_RES;
                const lon = minLon + u * (maxLon - minLon);
                const txF = lon2tile(lon, zoom);
                const pxF = (txF - x0) * tileSize;
                const px0 = Math.floor(pxF);
                const fx = pxF - px0;

                // Bilinear interpolation across DEM texels for smooth slopes
                const h00 = sampleDemPixel(px0, py0);
                const h10 = sampleDemPixel(px0 + 1, py0);
                const h01 = sampleDemPixel(px0, py0 + 1);
                const h11 = sampleDemPixel(px0 + 1, py0 + 1);
                const ele = (h00 * (1 - fx) + h10 * fx) * (1 - fy) + (h01 * (1 - fx) + h11 * fx) * fy;

                rawGrid[iz * (GRID_RES + 1) + ix] = ele;
              }
            }

            // Light 3x3 Gaussian smoothing pass to eliminate DEM quantization ridges
            let fetchedMin = Infinity;
            let fetchedMax = -Infinity;
            for (let iz = 0; iz <= GRID_RES; iz++) {
              for (let ix = 0; ix <= GRID_RES; ix++) {
                let sum = 0;
                let wSum = 0;
                for (let dz = -1; dz <= 1; dz++) {
                  for (let dx = -1; dx <= 1; dx++) {
                    const nz = Math.min(GRID_RES, Math.max(0, iz + dz));
                    const nx = Math.min(GRID_RES, Math.max(0, ix + dx));
                    const w = (dx === 0 ? 2 : 1) * (dz === 0 ? 2 : 1);
                    sum += rawGrid[nz * (GRID_RES + 1) + nx] * w;
                    wSum += w;
                  }
                }
                const smoothEle = sum / wSum;
                elevationGrid[iz * (GRID_RES + 1) + ix] = smoothEle;
                if (smoothEle < fetchedMin) fetchedMin = smoothEle;
                if (smoothEle > fetchedMax) fetchedMax = smoothEle;
              }
            }

            if (fetchedMax > fetchedMin && fetchedMin > -500) {
              gpxData.bounds.minEle = fetchedMin;
              gpxData.bounds.maxEle = fetchedMax;
              state.isRealDataLoaded = true;

              // Crop exact satellite bounds onto high-res texture canvas
              const cropCanvas = document.createElement('canvas');
              cropCanvas.width = 1024;
              cropCanvas.height = Math.round(1024 / aspect);
              const cropCtx = cropCanvas.getContext('2d');

              const sx = (xMinF - x0) * tileSize;
              const sy = (yMinF - y0) * tileSize;
              const sw = (xMaxF - xMinF) * tileSize;
              const sh = (yMaxF - yMinF) * tileSize;
              cropCtx.drawImage(satCanvas, sx, sy, sw, sh, 0, 0, cropCanvas.width, cropCanvas.height);

              // Subtle topo contour overlay when in hybrid mode
              if (state.surfaceStyle === 'hybrid') {
                drawContourLinesOnCanvas(cropCtx, cropCanvas.width, cropCanvas.height, gpxData, 0.22);
              }

              window._cachedSatelliteCanvas = cropCanvas;
              updateSurfaceTexture();
              rebuildDioramaMesh();
              setStatusBadge('Live DEM + Satellite', 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30');
            }
          }
        } catch (err) {
          // Offline / CORS-restricted environment seamlessly keeps the synthesized GPX terrain
          setStatusBadge('GPX 3D Relief', 'bg-amber-500/20 text-amber-300 border-amber-400/30');
        }
      }

      function synthesizeProceduralElevation(gpxData) {
        const { minLat, maxLat, minLon, maxLon } = gpxData.bounds;
        const samples = [];
        gpxData.tracks.forEach(t => {
          t.points.forEach((p, idx) => {
            if (idx % 2 === 0) samples.push({ lat: p.lat, lon: p.lon, ele: p.ele });
          });
        });

        for (let iz = 0; iz <= GRID_RES; iz++) {
          const v = iz / GRID_RES;
          const lat = maxLat - v * (maxLat - minLat);
          for (let ix = 0; ix <= GRID_RES; ix++) {
            const u = ix / GRID_RES;
            const lon = minLon + u * (maxLon - minLon);

            let num = 0;
            let den = 0;
            for (let s = 0; s < samples.length; s++) {
              const dLat = (lat - samples[s].lat) * 111320;
              const dLon = (lon - samples[s].lon) * 91600;
              const d2 = dLat * dLat + dLon * dLon + 180;
              const w = 1 / d2;
              num += samples[s].ele * w;
              den += w;
            }
            const baseEle = den > 0 ? num / den : 210;
            // Ouachita-style folded ridge modulation
            const ridge =
              Math.sin(u * 13.5 + v * 6.2) * 5.5 +
              Math.cos(u * 7.0 - v * 11.0) * 4.2 +
              Math.sin((u + v) * 24.0) * 1.8;

            elevationGrid[iz * (GRID_RES + 1) + ix] = baseEle + ridge;
          }
        }
      }

      function generateProceduralTextureCanvas(gpxData, style) {
        const w = 1024;
        const h = Math.max(256, Math.round(1024 * (blockDepth / blockWidth)));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const { minEle, maxEle } = gpxData.bounds;
        const eleSpan = Math.max(maxEle - minEle, 1);

        const imgData = ctx.createImageData(w, h);
        const data = imgData.data;

        for (let y = 0; y < h; y++) {
          const gz = (y / (h - 1)) * GRID_RES;
          const iz0 = Math.floor(gz);
          const iz1 = Math.min(GRID_RES, iz0 + 1);
          const fz = gz - iz0;

          for (let x = 0; x < w; x++) {
            const gx = (x / (w - 1)) * GRID_RES;
            const ix0 = Math.floor(gx);
            const ix1 = Math.min(GRID_RES, ix0 + 1);
            const fx = gx - ix0;

            const e00 = elevationGrid[iz0 * (GRID_RES + 1) + ix0];
            const e10 = elevationGrid[iz0 * (GRID_RES + 1) + ix1];
            const e01 = elevationGrid[iz1 * (GRID_RES + 1) + ix0];
            const e11 = elevationGrid[iz1 * (GRID_RES + 1) + ix1];
            const ele = (e00 * (1 - fx) + e10 * fx) * (1 - fz) + (e01 * (1 - fx) + e11 * fx) * fz;
            const t = Math.max(0, Math.min(1, (ele - minEle) / eleSpan));

            // Slope shading
            const dx = e10 - e00;
            const dz = e01 - e00;
            const shade = Math.max(-0.2, Math.min(0.2, (-dx - dz) * 0.025));

            // Canopy grain noise
            const grain = (Math.sin(x * 0.43 + y * 0.29) * Math.cos(x * 0.21 - y * 0.51)) * 7;

            let r, g, b;
            if (style === 'topo') {
              // Hypsometric forest-to-ridge palette
              r = 46 + t * 92 + shade * 60 + grain * 0.5;
              g = 94 + t * 76 + shade * 64 + grain * 0.6;
              b = 50 + t * 32 + shade * 40 + grain * 0.4;
            } else {
              // Natural pine/hardwood forest canopy simulation
              r = 34 + t * 34 + shade * 50 + grain;
              g = 74 + t * 44 + shade * 60 + grain * 1.1;
              b = 34 + t * 18 + shade * 35 + grain * 0.7;
            }

            const idx = (y * w + x) * 4;
            data[idx] = Math.max(0, Math.min(255, r));
            data[idx + 1] = Math.max(0, Math.min(255, g));
            data[idx + 2] = Math.max(0, Math.min(255, b));
            data[idx + 3] = 255;
          }
        }
        ctx.putImageData(imgData, 0, 0);

        // Add subtle clearing near Broken Leg Trail (southwest)
        if (style === 'hybrid') {
          const cx = w * 0.22;
          const cy = h * 0.76;
          const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 42);
          grad.addColorStop(0, 'rgba(194, 178, 146, 0.72)');
          grad.addColorStop(0.55, 'rgba(163, 152, 118, 0.35)');
          grad.addColorStop(1, 'rgba(163, 152, 118, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(cx, cy, 44, 22, -0.25, 0, Math.PI * 2);
          ctx.fill();
        }

        drawContourLinesOnCanvas(ctx, w, h, gpxData, style === 'topo' ? 0.38 : 0.2);
        return canvas;
      }

      function drawContourLinesOnCanvas(ctx, w, h, gpxData, alpha) {
        const { minEle, maxEle } = gpxData.bounds;
        const interval = 6; // 6-meter contour steps
        ctx.lineWidth = 1;

        for (let level = Math.ceil(minEle / interval) * interval; level < maxEle; level += interval) {
          const isMajor = Math.round(level) % (interval * 5) === 0;
          ctx.strokeStyle = isMajor
            ? `rgba(255, 250, 235, ${alpha * 1.55})`
            : `rgba(255, 250, 235, ${alpha * 0.75})`;
          ctx.lineWidth = isMajor ? 1.3 : 0.7;

          ctx.beginPath();
          for (let iz = 0; iz < GRID_RES; iz++) {
            for (let ix = 0; ix < GRID_RES; ix++) {
              const e00 = elevationGrid[iz * (GRID_RES + 1) + ix];
              const e10 = elevationGrid[iz * (GRID_RES + 1) + (ix + 1)];
              const e01 = elevationGrid[(iz + 1) * (GRID_RES + 1) + ix];
              if ((e00 < level && e10 >= level) || (e00 >= level && e10 < level)) {
                const t = (level - e00) / (e10 - e00);
                const px = ((ix + t) / GRID_RES) * w;
                const py = (iz / GRID_RES) * h;
                ctx.moveTo(px, py);
                ctx.lineTo(px + 1.5, py + (e01 > e00 ? 1.5 : -1.5));
              }
            }
          }
          ctx.stroke();
        }
      }

      function updateSurfaceTexture() {
        if (!state.gpxData) return;
        let canvas;
        if (state.isRealDataLoaded && state.surfaceStyle === 'hybrid' && window._cachedSatelliteCanvas) {
          canvas = window._cachedSatelliteCanvas;
        } else {
          canvas = generateProceduralTextureCanvas(state.gpxData, state.surfaceStyle);
        }
        if (activeTexture) activeTexture.dispose();
        activeTexture = new THREE.CanvasTexture(canvas);
        activeTexture.anisotropy = 4;
        if (terrainMesh) {
          terrainMesh.material.map = activeTexture;
          terrainMesh.material.needsUpdate = true;
        }
      }

      // =========================================================================
      // 5. COORDINATE PROJECTION & 3D MESH BUILDERS
      // =========================================================================
      function latLonToWorldXZ(lat, lon) {
        const { minLat, maxLat, minLon, maxLon } = state.gpxData.bounds;
        const u = (lon - minLon) / Math.max(maxLon - minLon, 1e-6);
        const v = (maxLat - lat) / Math.max(maxLat - minLat, 1e-6);
        return {
          x: (u - 0.5) * blockWidth,
          z: (v - 0.5) * blockDepth,
          u,
          v
        };
      }

      function sampleElevationAtUV(u, v) {
        const cu = Math.max(0, Math.min(1, u));
        const cv = Math.max(0, Math.min(1, v));
        const gx = cu * GRID_RES;
        const gz = cv * GRID_RES;
        const ix0 = Math.floor(gx);
        const iz0 = Math.floor(gz);
        const ix1 = Math.min(GRID_RES, ix0 + 1);
        const iz1 = Math.min(GRID_RES, iz0 + 1);
        const fx = gx - ix0;
        const fz = gz - iz0;

        const e00 = elevationGrid[iz0 * (GRID_RES + 1) + ix0];
        const e10 = elevationGrid[iz0 * (GRID_RES + 1) + ix1];
        const e01 = elevationGrid[iz1 * (GRID_RES + 1) + ix0];
        const e11 = elevationGrid[iz1 * (GRID_RES + 1) + ix1];
        return (e00 * (1 - fx) + e10 * fx) * (1 - fz) + (e01 * (1 - fx) + e11 * fx) * fz;
      }

      function eleMetersToWorldY(eleMeters) {
        const { minEle } = state.gpxData.bounds;
        // True-to-scale vertical conversion so 1.0x matches real horizontal scale
        return ((eleMeters - minEle) / Math.max(metersPerWorldUnit, 1)) * state.exaggeration;
      }

      function rebuildDioramaMesh() {
        if (!dioramaGroup || !state.gpxData) return;

        if (terrainMesh) {
          dioramaGroup.remove(terrainMesh);
          terrainMesh.geometry.dispose();
        }
        if (skirtMesh) {
          dioramaGroup.remove(skirtMesh);
          skirtMesh.geometry.dispose();
        }
        if (basePlinthMesh) {
          dioramaGroup.remove(basePlinthMesh);
          basePlinthMesh.geometry.dispose();
        }

        // Top Surface PlaneGeometry
        const geo = new THREE.PlaneGeometry(blockWidth, blockDepth, GRID_RES, GRID_RES);
        geo.rotateX(-Math.PI / 2);

        const pos = geo.attributes.position;
        for (let iz = 0; iz <= GRID_RES; iz++) {
          for (let ix = 0; ix <= GRID_RES; ix++) {
            const idx = iz * (GRID_RES + 1) + ix;
            const ele = elevationGrid[idx];
            pos.setY(idx, eleMetersToWorldY(ele));
          }
        }
        geo.computeVertexNormals();

        const mat = new THREE.MeshStandardMaterial({
          map: activeTexture,
          roughness: 0.86,
          metalness: 0.04
        });

        terrainMesh = new THREE.Mesh(geo, mat);
        terrainMesh.receiveShadow = true;
        terrainMesh.castShadow = true;
        dioramaGroup.add(terrainMesh);

        // Geological Cross-Section Skirt Walls
        const skirtBottom = -16;
        const skirtPositions = [];
        const skirtColors = [];

        const addQuad = (x1, y1, z1, x2, y2, z2) => {
          skirtPositions.push(
            x1, y1, z1,  x1, skirtBottom, z1,  x2, y2, z2,
            x2, y2, z2,  x1, skirtBottom, z1,  x2, skirtBottom, z2
          );
          for (let k = 0; k < 6; k++) {
            const isBottom = k === 1 || k === 4 || k === 5;
            if (isBottom) {
              skirtColors.push(0.11, 0.09, 0.08);
            } else {
              skirtColors.push(0.24, 0.20, 0.17);
            }
          }
        };

        // North & South Edges
        for (let ix = 0; ix < GRID_RES; ix++) {
          const u0 = ix / GRID_RES;
          const u1 = (ix + 1) / GRID_RES;
          const x0 = (u0 - 0.5) * blockWidth;
          const x1 = (u1 - 0.5) * blockWidth;

          // North edge (iz = 0)
          const zN = -0.5 * blockDepth;
          addQuad(x1, eleMetersToWorldY(elevationGrid[ix + 1]), zN, x0, eleMetersToWorldY(elevationGrid[ix]), zN);

          // South edge (iz = GRID_RES)
          const zS = 0.5 * blockDepth;
          const rowS = GRID_RES * (GRID_RES + 1);
          addQuad(x0, eleMetersToWorldY(elevationGrid[rowS + ix]), zS, x1, eleMetersToWorldY(elevationGrid[rowS + ix + 1]), zS);
        }

        // West & East Edges
        for (let iz = 0; iz < GRID_RES; iz++) {
          const v0 = iz / GRID_RES;
          const v1 = (iz + 1) / GRID_RES;
          const z0 = (v0 - 0.5) * blockDepth;
          const z1 = (v1 - 0.5) * blockDepth;

          // West edge (ix = 0)
          const xW = -0.5 * blockWidth;
          addQuad(
            xW, eleMetersToWorldY(elevationGrid[iz * (GRID_RES + 1)]), z0,
            xW, eleMetersToWorldY(elevationGrid[(iz + 1) * (GRID_RES + 1)]), z1
          );

          // East edge (ix = GRID_RES)
          const xE = 0.5 * blockWidth;
          addQuad(
            xE, eleMetersToWorldY(elevationGrid[(iz + 1) * (GRID_RES + 1) + GRID_RES]), z1,
            xE, eleMetersToWorldY(elevationGrid[iz * (GRID_RES + 1) + GRID_RES]), z0
          );
        }

        const skirtGeo = new THREE.BufferGeometry();
        skirtGeo.setAttribute('position', new THREE.Float32BufferAttribute(skirtPositions, 3));
        skirtGeo.setAttribute('color', new THREE.Float32BufferAttribute(skirtColors, 3));
        skirtGeo.computeVertexNormals();

        const skirtMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.94,
          metalness: 0.05
        });

        skirtMesh = new THREE.Mesh(skirtGeo, skirtMat);
        skirtMesh.castShadow = true;
        skirtMesh.receiveShadow = true;
        dioramaGroup.add(skirtMesh);

        // Dark Studio Base Plinth
        const plinthGeo = new THREE.BoxGeometry(blockWidth + 3, 6, blockDepth + 3);
        const plinthMat = new THREE.MeshStandardMaterial({
          color: 0x111714,
          roughness: 0.7,
          metalness: 0.25
        });
        basePlinthMesh = new THREE.Mesh(plinthGeo, plinthMat);
        basePlinthMesh.position.y = skirtBottom - 3;
        basePlinthMesh.receiveShadow = true;
        dioramaGroup.add(basePlinthMesh);

        build3DRoads();
        build3DWaypoints();
      }

      // =========================================================================
      // 6. CLEAN WARM-TOPO 3D ROUTES (NO BLACK CASINGS)
      // =========================================================================
      function build3DRoads() {
        roadMeshes.forEach(m => {
          dioramaGroup.remove(m);
          m.geometry.dispose();
        });
        roadMeshes = [];

        state.gpxData.tracks.forEach(track => {
          const cfg = TIER_CONFIG[track.tier] || TIER_CONFIG.secondary;
          const isSelected = state.selectedItem?.type === 'track' && state.selectedItem.data.id === track.id;

          const pts3D = [];
          track.points.forEach(p => {
            const { x, z, u, v } = latLonToWorldXZ(p.lat, p.lon);
            const terrainEle = sampleElevationAtUV(u, v);
            const y = eleMetersToWorldY(terrainEle) + 0.75;
            pts3D.push(new THREE.Vector3(x, y, z));
          });

          // Deduplicate consecutive identical points
          const cleanPts = [pts3D[0]];
          for (let i = 1; i < pts3D.length; i++) {
            if (pts3D[i].distanceTo(cleanPts[cleanPts.length - 1]) > 0.2) {
              cleanPts.push(pts3D[i]);
            }
          }
          if (cleanPts.length < 2) return;

          const curve = new THREE.CatmullRomCurve3(cleanPts);
          const tubularSegments = Math.min(260, Math.max(24, cleanPts.length * 4));
          const radius = isSelected ? cfg.radius * 1.48 : cfg.radius;

          const tubeGeo = new THREE.TubeGeometry(curve, tubularSegments, radius, 8, false);
          const tubeMat = new THREE.MeshBasicMaterial({
            color: isSelected ? 0x00ff9d : cfg.colorInt,
            toneMapped: false
          });

          const mesh = new THREE.Mesh(tubeGeo, tubeMat);
          mesh.visible = state.layers[track.tier];
          mesh.userData = {
            itemType: 'track',
            track,
            curve
          };
          dioramaGroup.add(mesh);
          roadMeshes.push(mesh);
        });
      }

      // =========================================================================
      // 7. CUSTOM 3D WAYPOINT MODELS (STAND TOWERS, ONE-SIDED SWING GATES, SHOP)
      // =========================================================================
      function buildHuntingStand3DMesh(isSelected) {
        const group = new THREE.Group();
        const legMat = new THREE.MeshStandardMaterial({
          color: isSelected ? 0x10b981 : 0x475569,
          roughness: 0.55,
          metalness: 0.45
        });
        const cabinMat = new THREE.MeshStandardMaterial({
          color: isSelected ? 0x34d399 : 0x10b981,
          emissive: isSelected ? 0x059669 : 0x064e3b,
          emissiveIntensity: isSelected ? 0.55 : 0.25,
          roughness: 0.45
        });
        const roofMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          roughness: 0.65
        });

        // 4 splayed tower legs
        const legGeo = new THREE.CylinderGeometry(0.14, 0.2, 4.4, 6);
        const offsets = [
          [-0.75, -0.75, 0.12, -0.12],
          [0.75, -0.75, -0.12, -0.12],
          [-0.75, 0.75, 0.12, 0.12],
          [0.75, 0.75, -0.12, 0.12]
        ];
        offsets.forEach(([ox, oz, rx, rz]) => {
          const leg = new THREE.Mesh(legGeo, legMat);
          leg.position.set(ox, 2.1, oz);
          leg.rotation.set(rz, 0, rx);
          leg.castShadow = true;
          group.add(leg);
        });

        // Cross-brace platform
        const deck = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.22, 2.1), legMat);
        deck.position.y = 4.1;
        group.add(deck);

        // Elevated Enclosed Box Blind
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.85, 1.85, 1.85), cabinMat);
        box.position.y = 5.1;
        box.castShadow = true;
        group.add(box);

        // Pitched Pyramid Roof
        const roof = new THREE.Mesh(new THREE.ConeGeometry(1.55, 0.9, 4), roofMat);
        roof.position.y = 6.45;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);

        return group;
      }

      function buildOneSidedSwingGate3DMesh(isSelected) {
        const group = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.5,
          metalness: 0.5
        });
        const redMat = new THREE.MeshStandardMaterial({
          color: isSelected ? 0x10b981 : 0xef4444,
          emissive: isSelected ? 0x059669 : 0x7f1d1d,
          emissiveIntensity: 0.35,
          roughness: 0.4
        });
        const whiteMat = new THREE.MeshStandardMaterial({
          color: 0xfaf6ec,
          roughness: 0.4
        });

        // Single Hinge Post on Left (-X)
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 3.6, 10), postMat);
        post.position.set(-1.6, 1.8, 0);
        post.castShadow = true;
        group.add(post);

        // Post Cap
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 10), redMat);
        cap.position.set(-1.6, 3.65, 0);
        group.add(cap);

        // Hinge Collars
        [1.5, 2.8].forEach(hy => {
          const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.25, 10), redMat);
          collar.position.set(-1.6, hy, 0);
          group.add(collar);
        });

        // Cantilevered Red-and-White Striped Swing Arm extending Right (+X)
        const segCount = 5;
        const segW = 0.68;
        for (let i = 0; i < segCount; i++) {
          const seg = new THREE.Mesh(
            new THREE.BoxGeometry(segW, 0.36, 0.24),
            i % 2 === 0 ? redMat : whiteMat
          );
          seg.position.set(-1.2 + i * segW, 2.55, 0);
          seg.castShadow = true;
          group.add(seg);
        }

        // Diagonal Support Brace from lower hinge post to mid-arm
        const brace = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.9, 8), postMat);
        brace.position.set(-0.75, 2.0, 0);
        brace.rotation.z = -Math.PI / 3.2;
        group.add(brace);

        return group;
      }

      function buildShop3DMesh(isSelected) {
        const group = new THREE.Group();
        const wallMat = new THREE.MeshStandardMaterial({
          color: isSelected ? 0x10b981 : 0xdc2626,
          emissive: isSelected ? 0x059669 : 0x7f1d1d,
          emissiveIntensity: 0.3,
          roughness: 0.55
        });
        const roofMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.65
        });
        const doorMat = new THREE.MeshStandardMaterial({
          color: 0xfaf6ec,
          roughness: 0.45
        });

        // Main Barn/Shop Body
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.3, 2.6), wallMat);
        body.position.y = 1.15;
        body.castShadow = true;
        group.add(body);

        // White Roll-Up Bay Door
        const door = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.45, 0.14), doorMat);
        door.position.set(0, 0.75, 1.32);
        group.add(door);

        // Pitched Gable Roof (extruded triangular prism)
        const roofShape = new THREE.Shape();
        roofShape.moveTo(-1.85, 0);
        roofShape.lineTo(1.85, 0);
        roofShape.lineTo(0, 1.25);
        roofShape.closePath();

        const roofGeo = new THREE.ExtrudeGeometry(roofShape, {
          depth: 3.0,
          bevelEnabled: false
        });
        roofGeo.translate(0, 2.3, -1.5);
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.castShadow = true;
        group.add(roof);

        return group;
      }

      function build3DWaypoints() {
        waypointMeshes.forEach(m => dioramaGroup.remove(m));
        waypointMeshes = [];

        const overlay = document.getElementById('labels-overlay');
        overlay.innerHTML = '';

        state.gpxData.waypoints.forEach(wpt => {
          const { x, z, u, v } = latLonToWorldXZ(wpt.lat, wpt.lon);
          const terrainEle = sampleElevationAtUV(u, v);
          const groundY = eleMetersToWorldY(terrainEle);
          const isSelected = state.selectedItem?.type === 'waypoint' && state.selectedItem.data.id === wpt.id;

          let pinGroup;
          let labelHeightOffset = 7.4;

          if (wpt.category === 'stand') {
            pinGroup = buildHuntingStand3DMesh(isSelected);
            labelHeightOffset = 7.8;
          } else if (wpt.category === 'gate') {
            pinGroup = buildOneSidedSwingGate3DMesh(isSelected);
            labelHeightOffset = 4.6;
          } else if (wpt.category === 'shop') {
            pinGroup = buildShop3DMesh(isSelected);
            labelHeightOffset = 4.5;
          } else {
            pinGroup = new THREE.Group();
            const sphere = new THREE.Mesh(
              new THREE.SphereGeometry(1.1, 14, 14),
              new THREE.MeshBasicMaterial({ color: isSelected ? 0x10b981 : 0x38bdf8 })
            );
            sphere.position.y = 1.6;
            pinGroup.add(sphere);
            labelHeightOffset = 3.6;
          }

          pinGroup.position.set(x, groundY, z);
          pinGroup.visible = state.layers.waypoints;
          pinGroup.userData = {
            itemType: 'waypoint',
            waypoint: wpt,
            labelAnchor: new THREE.Vector3(x, groundY + labelHeightOffset, z)
          };

          dioramaGroup.add(pinGroup);
          waypointMeshes.push(pinGroup);

          // Floating DOM Label
          const labelEl = document.createElement('div');
          labelEl.id = `label-${wpt.id}`;
          labelEl.className = `wpt-label px-2 py-1 rounded-lg text-[11px] font-semibold shadow-lg border backdrop-blur-md flex items-center gap-1.5 whitespace-nowrap ${
            isSelected
              ? 'selected bg-emerald-500 text-slate-950 border-emerald-300'
              : 'bg-slate-900/85 text-slate-100 border-white/15 hover:border-emerald-400/60'
          }`;
          labelEl.innerHTML = `${getWaypointBadgeSVG(wpt.category)}<span>${wpt.name}</span>`;
          labelEl.onclick = e => {
            e.stopPropagation();
            selectWaypoint(wpt);
          };
          overlay.appendChild(labelEl);
        });
      }

      function updateWaypointScreenLabels() {
        if (!camera || !renderer || state.renderMode !== 'diorama') return;
        const width = renderer.domElement.clientWidth;
        const height = renderer.domElement.clientHeight;

        waypointMeshes.forEach(group => {
          const wpt = group.userData.waypoint;
          const el = document.getElementById(`label-${wpt.id}`);
          if (!el) return;

          if (!state.layers.waypoints) {
            el.style.display = 'none';
            return;
          }

          const proj = group.userData.labelAnchor.clone().project(camera);
          if (proj.z > 1) {
            el.style.display = 'none';
            return;
          }

          const sx = (proj.x * 0.5 + 0.5) * width;
          const sy = (-(proj.y * 0.5) + 0.5) * height;

          if (sx < -60 || sx > width + 60 || sy < -40 || sy > height + 40) {
            el.style.display = 'none';
          } else {
            el.style.display = 'flex';
            el.style.left = `${sx}px`;
            el.style.top = `${sy}px`;
          }
        });
      }

      // =========================================================================
      // 8. MAPLIBRE GL SATELLITE 3D TERRAIN VIEW
      // =========================================================================
      let maplibreMap = null;
      let maplibreMarkers = [];

      function initMapLibre() {
        if (maplibreMap || typeof window.maplibregl === 'undefined' || !state.gpxData) return;
        try {
          const { centerLat, centerLon } = state.gpxData.bounds;
          maplibreMap = new maplibregl.Map({
            container: 'maplibre-container',
            center: [centerLon, centerLat],
            zoom: 14.3,
            pitch: 58,
            bearing: -24,
            antialias: true,
            style: {
              version: 8,
              sources: {
                satellite: {
                  type: 'raster',
                  tiles: [
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                  ],
                  tileSize: 256
                },
                terrainDEM: {
                  type: 'raster-dem',
                  tiles: [
                    'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'
                  ],
                  encoding: 'terrarium',
                  tileSize: 256,
                  maxzoom: 15
                }
              },
              terrain: {
                source: 'terrainDEM',
                exaggeration: 1.65
              },
              layers: [
                {
                  id: 'satellite-base',
                  type: 'raster',
                  source: 'satellite'
                }
              ]
            }
          });

          maplibreMap.on('load', () => {
            syncMapLibreData();
          });
        } catch (err) {
          console.warn('MapLibre fallback triggered:', err);
        }
      }

      function syncMapLibreData() {
        if (!maplibreMap || !maplibreMap.isStyleLoaded() || !state.gpxData) return;

        ['main', 'secondary'].forEach(tier => {
          const srcId = `gpx-${tier}`;
          const lineId = `line-${tier}`;
          if (maplibreMap.getLayer(lineId)) maplibreMap.removeLayer(lineId);
          if (maplibreMap.getSource(srcId)) maplibreMap.removeSource(srcId);

          const features = state.gpxData.tracks
            .filter(t => t.tier === tier)
            .map(t => ({
              type: 'Feature',
              properties: { id: t.id, name: t.name, tier: t.tier },
              geometry: {
                type: 'LineString',
                coordinates: t.points.map(p => [p.lon, p.lat])
              }
            }));

          maplibreMap.addSource(srcId, {
            type: 'geojson',
            data: { type: 'FeatureCollection', features }
          });

          const cfg = TIER_CONFIG[tier];
          maplibreMap.addLayer({
            id: lineId,
            type: 'line',
            source: srcId,
            layout: {
              'line-join': 'round',
              'line-cap': 'round',
              visibility: state.layers[tier] ? 'visible' : 'none'
            },
            paint: {
              'line-color': cfg.colorHex,
              'line-width': tier === 'main' ? 4.2 : 3.0
            }
          });

          maplibreMap.on('click', lineId, e => {
            if (e.features && e.features.length > 0) {
              const trkId = e.features[0].properties.id;
              const trk = state.gpxData.tracks.find(t => t.id === trkId);
              if (trk) selectTrack(trk);
            }
          });
        });

        // Clear & recreate DOM Markers
        maplibreMarkers.forEach(m => m.remove());
        maplibreMarkers = [];

        if (state.layers.waypoints) {
          state.gpxData.waypoints.forEach(wpt => {
            const el = document.createElement('div');
            el.className =
              'px-2 py-1 rounded-lg text-[11px] font-semibold shadow-lg border bg-slate-900/90 text-slate-100 border-white/20 flex items-center gap-1.5 cursor-pointer hover:border-emerald-400';
            el.innerHTML = `${getWaypointBadgeSVG(wpt.category)}<span>${wpt.name}</span>`;
            el.onclick = () => selectWaypoint(wpt);

            const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
              .setLngLat([wpt.lon, wpt.lat])
              .addTo(maplibreMap);
            maplibreMarkers.push(marker);
          });
        }
      }

      // =========================================================================
      // 9. INTERACTIVE SELECTION, ELEVATION PROFILE & UI CONTROLS
      // =========================================================================
      function populateDropdown() {
        const select = document.getElementById('feature-select');
        select.innerHTML = '<option value="">-- Overview (All Trails &amp; Stands) --</option>';

        const trkGroup = document.createElement('optgroup');
        trkGroup.label = 'Roads & Trails';
        state.gpxData.tracks.forEach(t => {
          const opt = document.createElement('option');
          opt.value = `track:${t.id}`;
          opt.textContent = `${t.name} (${(t.totalDist * METERS_TO_MILES).toFixed(2)} mi)`;
          trkGroup.appendChild(opt);
        });
        select.appendChild(trkGroup);

        const wptGroup = document.createElement('optgroup');
        wptGroup.label = 'Stands, Gates & Shop';
        state.gpxData.waypoints.forEach(w => {
          const opt = document.createElement('option');
          opt.value = `wpt:${w.id}`;
          opt.textContent = w.name;
          wptGroup.appendChild(opt);
        });
        select.appendChild(wptGroup);
      }

      function handleDropdownSelect(val) {
        if (!val) {
          clearSelection();
          return;
        }
        const [type, id] = val.split(':');
        if (type === 'track') {
          const trk = state.gpxData.tracks.find(t => t.id === id);
          if (trk) selectTrack(trk);
        } else if (type === 'wpt') {
          const wpt = state.gpxData.waypoints.find(w => w.id === id);
          if (wpt) selectWaypoint(wpt);
        }
      }

      function selectTrack(track) {
        state.selectedItem = { type: 'track', data: track };
        document.getElementById('feature-select').value = `track:${track.id}`;
        build3DRoads();
        build3DWaypoints();

        const cfg = TIER_CONFIG[track.tier];
        const drawer = document.getElementById('inspector-drawer');
        drawer.classList.remove('hidden');
        document.getElementById('elevation-chart-wrapper').classList.remove('hidden');

        document.getElementById('inspector-badge').style.backgroundColor = cfg.colorHex;
        document.getElementById('inspector-title').textContent = track.name;
        document.getElementById('inspector-tier-pill').textContent = cfg.label;

        const miles = (track.totalDist * METERS_TO_MILES).toFixed(2);
        const minFt = Math.round(track.minEle * METERS_TO_FEET);
        const maxFt = Math.round(track.maxEle * METERS_TO_FEET);
        const gainFt = Math.round(track.gain * METERS_TO_FEET);
        document.getElementById('inspector-meta').textContent =
          `Distance: ${miles} mi • Elev: ${minFt} ft – ${maxFt} ft • Gain: +${gainFt} ft`;

        drawElevationChart(track);

        // Focus camera gently on track midpoint
        const midPt = track.points[Math.floor(track.points.length / 2)];
        if (state.renderMode === 'diorama' && orbit.target) {
          const { x, z, u, v } = latLonToWorldXZ(midPt.lat, midPt.lon);
          const y = eleMetersToWorldY(sampleElevationAtUV(u, v));
          orbit.target.set(x * 0.55, y * 0.6, z * 0.55);
          updateCameraFromOrbit();
        } else if (maplibreMap) {
          maplibreMap.flyTo({ center: [midPt.lon, midPt.lat], zoom: 15.2, duration: 900 });
        }
      }

      function selectWaypoint(wpt) {
        state.selectedItem = { type: 'waypoint', data: wpt };
        document.getElementById('feature-select').value = `wpt:${wpt.id}`;
        build3DRoads();
        build3DWaypoints();

        const drawer = document.getElementById('inspector-drawer');
        drawer.classList.remove('hidden');
        document.getElementById('elevation-chart-wrapper').classList.add('hidden');
        if (scrubMarkerMesh) scrubMarkerMesh.visible = false;

        const { x, z, u, v } = latLonToWorldXZ(wpt.lat, wpt.lon);
        const terrainEle = wpt.ele !== null ? wpt.ele : sampleElevationAtUV(u, v);
        const eleFt = Math.round(terrainEle * METERS_TO_FEET);

        const badgeColor =
          wpt.category === 'stand' ? '#10b981' : wpt.category === 'gate' ? '#ef4444' : '#f59e0b';
        const pillText =
          wpt.category === 'stand'
            ? 'Hunting Stand'
            : wpt.category === 'gate'
            ? 'Property Gate'
            : wpt.category === 'shop'
            ? 'Base / Shop'
            : 'Landmark';

        document.getElementById('inspector-badge').style.backgroundColor = badgeColor;
        document.getElementById('inspector-title').textContent = wpt.name;
        document.getElementById('inspector-tier-pill').textContent = pillText;
        document.getElementById('inspector-meta').textContent =
          `Elevation: ${eleFt} ft • GPS: ${wpt.lat.toFixed(5)}° N, ${Math.abs(wpt.lon).toFixed(5)}° W`;

        if (state.renderMode === 'diorama' && orbit.target) {
          const y = eleMetersToWorldY(terrainEle);
          orbit.target.set(x * 0.65, y * 0.7, z * 0.65);
          updateCameraFromOrbit();
        } else if (maplibreMap) {
          maplibreMap.flyTo({ center: [wpt.lon, wpt.lat], zoom: 15.8, duration: 900 });
        }
      }

      function clearSelection() {
        state.selectedItem = null;
        document.getElementById('feature-select').value = '';
        document.getElementById('inspector-drawer').classList.add('hidden');
        if (scrubMarkerMesh) scrubMarkerMesh.visible = false;
        build3DRoads();
        build3DWaypoints();
      }

      function drawElevationChart(track) {
        const canvas = document.getElementById('elevation-canvas');
        const wrapper = document.getElementById('elevation-chart-wrapper');
        if (!canvas || !wrapper) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = wrapper.getBoundingClientRect();
        canvas.width = Math.max(200, Math.floor(rect.width * dpr));
        canvas.height = Math.max(60, Math.floor(rect.height * dpr));

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        const w = rect.width;
        const h = rect.height;

        ctx.clearRect(0, 0, w, h);

        const padL = 10, padR = 10, padT = 14, padB = 12;
        const plotW = w - padL - padR;
        const plotH = h - padT - padB;

        const minE = track.minEle - 2;
        const maxE = track.maxEle + 2;
        const spanE = Math.max(maxE - minE, 1);
        const totalD = Math.max(track.totalDist, 1);

        const cfg = TIER_CONFIG[track.tier];

        // Gradient fill
        const grad = ctx.createLinearGradient(0, padT, 0, h - padB);
        grad.addColorStop(0, cfg.rgba);
        grad.addColorStop(1, 'rgba(15, 23, 42, 0.05)');

        ctx.beginPath();
        track.points.forEach((pt, idx) => {
          const px = padL + (pt.dist / totalD) * plotW;
          const py = padT + plotH - ((pt.ele - minE) / spanE) * plotH;
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.lineTo(padL + plotW, padT + plotH);
        ctx.lineTo(padL, padT + plotH);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        // Profile Stroke
        ctx.beginPath();
        track.points.forEach((pt, idx) => {
          const px = padL + (pt.dist / totalD) * plotW;
          const py = padT + plotH - ((pt.ele - minE) / spanE) * plotH;
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = cfg.colorHex;
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }

      function setupProfileScrubber() {
        const wrapper = document.getElementById('elevation-chart-wrapper');
        const readout = document.getElementById('elevation-readout');

        const handleMove = clientX => {
          if (!state.selectedItem || state.selectedItem.type !== 'track') return;
          const track = state.selectedItem.data;
          const rect = wrapper.getBoundingClientRect();
          const t = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
          const targetDist = t * track.totalDist;

          let closest = track.points[0];
          for (let i = 1; i < track.points.length; i++) {
            if (track.points[i].dist >= targetDist) {
              closest = track.points[i];
              break;
            }
            closest = track.points[i];
          }

          readout.classList.remove('hidden');
          readout.textContent = `${(closest.dist * METERS_TO_MILES).toFixed(2)} mi • ${Math.round(
            closest.ele * METERS_TO_FEET
          )} ft`;

          if (scrubMarkerMesh) {
            const { x, z, u, v } = latLonToWorldXZ(closest.lat, closest.lon);
            const y = eleMetersToWorldY(sampleElevationAtUV(u, v)) + 1.4;
            scrubMarkerMesh.position.set(x, y, z);
            scrubMarkerMesh.visible = true;
          }
        };

        wrapper.addEventListener('mousemove', e => handleMove(e.clientX));
        wrapper.addEventListener('touchmove', e => {
          if (e.touches[0]) handleMove(e.touches[0].clientX);
        });
        wrapper.addEventListener('mouseleave', () => {
          readout.classList.add('hidden');
          if (scrubMarkerMesh) scrubMarkerMesh.visible = false;
        });
      }

      function toggleLayer(layerKey, visible) {
        state.layers[layerKey] = visible;
        if (layerKey === 'waypoints') {
          waypointMeshes.forEach(m => (m.visible = visible));
          updateWaypointScreenLabels();
        } else {
          roadMeshes.forEach(m => {
            if (m.userData.track.tier === layerKey) m.visible = visible;
          });
        }
        if (maplibreMap) syncMapLibreData();
      }

      function updateExaggeration(val) {
        state.exaggeration = parseFloat(val);
        document.getElementById('exag-value').textContent = `${state.exaggeration.toFixed(1)}x`;
        rebuildDioramaMesh();
      }

      function setSurfaceStyle(style) {
        state.surfaceStyle = style;
        const btnHybrid = document.getElementById('btn-tex-hybrid');
        const btnTopo = document.getElementById('btn-tex-topo');

        if (style === 'hybrid') {
          btnHybrid.className =
            'py-1.5 px-2.5 rounded-xl font-medium border border-emerald-400/50 bg-emerald-500/20 text-emerald-200 transition';
          btnTopo.className =
            'py-1.5 px-2.5 rounded-xl font-medium border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 transition';
        } else {
          btnTopo.className =
            'py-1.5 px-2.5 rounded-xl font-medium border border-emerald-400/50 bg-emerald-500/20 text-emerald-200 transition';
          btnHybrid.className =
            'py-1.5 px-2.5 rounded-xl font-medium border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 transition';
        }
        updateSurfaceTexture();
      }

      function setRenderMode(mode) {
        state.renderMode = mode;
        const btnDiorama = document.getElementById('btn-mode-diorama');
        const btnSat = document.getElementById('btn-mode-satellite');
        const threeCont = document.getElementById('three-container');
        const labelsOv = document.getElementById('labels-overlay');
        const vignette = document.getElementById('vignette-overlay');
        const mapCont = document.getElementById('maplibre-container');
        const dioramaCtrl = document.getElementById('diorama-controls');

        if (mode === 'diorama') {
          btnDiorama.className =
            'px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-emerald-500 text-slate-950 shadow-md';
          btnSat.className =
            'px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-slate-300 hover:text-white';
          threeCont.classList.remove('hidden');
          labelsOv.classList.remove('hidden');
          vignette.classList.remove('hidden');
          dioramaCtrl.classList.remove('hidden');
          mapCont.classList.add('hidden');
        } else {
          btnSat.className =
            'px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-emerald-500 text-slate-950 shadow-md';
          btnDiorama.className =
            'px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-slate-300 hover:text-white';
          threeCont.classList.add('hidden');
          labelsOv.classList.add('hidden');
          vignette.classList.add('hidden');
          dioramaCtrl.classList.add('hidden');
          mapCont.classList.remove('hidden');

          if (!maplibreMap) {
            initMapLibre();
          } else {
            maplibreMap.resize();
            syncMapLibreData();
          }
        }
      }

      function toggleSidebar() {
        document.getElementById('sidebar-panel').classList.toggle('hidden');
      }

      function resetCamera() {
        orbit.theta = -0.42;
        orbit.phi = 0.88;
        orbit.radius = 315;
        if (orbit.target) orbit.target.set(0, 12, 0);
        updateCameraFromOrbit();
      }

      function setStatusBadge(text, classes) {
        const badge = document.getElementById('terrain-status-badge');
        if (!badge) return;
        badge.textContent = text;
        badge.className = `text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full border ${classes}`;
      }

      // =========================================================================
      // 10. ANIMATION LOOP & BOOTSTRAP
      // =========================================================================
      function animateLoop() {
        requestAnimationFrame(animateLoop);
        if (state.renderMode === 'diorama' && renderer && scene && camera) {
          if (autoRotate && !orbit.isDragging) {
            orbit.theta += 0.0025;
            updateCameraFromOrbit();
          }
          renderer.render(scene, camera);
          updateWaypointScreenLabels();
        }
      }

      async function bootstrapApp() {
        try {
          await ensureThreeLoaded();
          initThreeEngine();
          setupProfileScrubber();

          const rawGpx = document.getElementById('default-gpx-data').textContent;
          const parsed = parseGPXString(rawGpx);
          state.gpxData = parsed;

          const minFt = Math.round(parsed.bounds.minEle * METERS_TO_FEET);
          const maxFt = Math.round(parsed.bounds.maxEle * METERS_TO_FEET);
          document.getElementById('map-title').textContent = parsed.title;
          document.getElementById(
            'map-subtitle'
          ).textContent = `${parsed.tracks.length} Tracks • ${parsed.waypoints.length} Stands & Gates • Elev ${minFt}–${maxFt} ft`;

          populateDropdown();
          await buildTerrainFromGPX(parsed);
          animateLoop();
        } catch (err) {
          console.error('3D Map bootstrap failed:', err);
          setStatusBadge('Render Error', 'bg-rose-500/20 text-rose-300 border-rose-400/30');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrapApp);
      } else {
        bootstrapApp();
      }
    </script>
  </body>
