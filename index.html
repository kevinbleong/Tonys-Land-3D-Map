<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony's Land — Interactive 3D Terrain &amp; Trail Map</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MapLibre GL JS (for Satellite 3D Terrain Mode) -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script>
      // Prevent cross-origin SecurityError when MapLibre inspects window.parent/window.top in sandboxed iframes
      (function () {
        const safeLoc = window.location;
        try { void window.parent.location.href; } catch (e) {
          try { Object.defineProperty(window, 'parent', { value: window, configurable: true }); } catch (_) {}
        }
        try { void window.top.location.href; } catch (e) {
          try { Object.defineProperty(window, 'top', { value: window, configurable: true }); } catch (_) {}
        }
        if (!window.location.origin || window.location.origin === 'null') {
          try { Object.defineProperty(safeLoc, 'origin', { value: 'https://localhost', configurable: true }); } catch (_) {}
        }
      })();
    </script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0b0f0d;
        color: #f1f5f9;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Custom Scrollbar for Control Drawer */
      .custom-scroll::-webkit-scrollbar { width: 5px; }
      .custom-scroll::-webkit-scrollbar-track { background: transparent; }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.25);
        border-radius: 9999px;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.45);
      }

      /* 3D Floating Waypoint Labels */
      .wpt-label {
        position: absolute;
        transform: translate(-50%, -100%);
        pointer-events: auto;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.2s ease, background-color 0.15s ease;
        z-index: 15;
        will-change: left, top;
      }
      .wpt-label:hover {
        transform: translate(-50%, -105%) scale(1.06);
        z-index: 25;
      }
      .wpt-label.selected {
        z-index: 30;
        transform: translate(-50%, -108%) scale(1.08);
      }

      /* Range Slider Styling */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: rgba(255, 255, 255, 0.12);
        height: 6px;
        border-radius: 999px;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #10b981;
        cursor: pointer;
        border: 2px solid #0f172a;
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      }
      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #10b981;
        cursor: pointer;
        border: 2px solid #0f172a;
      }

      .maplibregl-ctrl-attrib { display: none !important; }
    </style>
  </head>
  <body class="relative w-full h-full overflow-hidden bg-[#0b0f0d]">
    <!-- ===================================================================== -->
    <!-- VIEWPORT CONTAINERS                                                   -->
    <!-- ===================================================================== -->
    <div id="three-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>
    <div id="labels-overlay" class="absolute inset-0 w-full h-full pointer-events-none overflow-hidden z-10"></div>
    <div id="maplibre-container" class="absolute inset-0 w-full h-full z-0 hidden"></div>

    <!-- Subtle Vignette for Diorama Depth -->
    <div id="vignette-overlay" class="pointer-events-none absolute inset-0 z-10 bg-[radial-gradient(circle_at_center,transparent_58%,rgba(5,8,7,0.72)_100%)]"></div>

    <!-- ===================================================================== -->
    <!-- TOP HEADER BAR                                                        -->
    <!-- ===================================================================== -->
    <header class="absolute top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 z-30 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
      <!-- Brand / Property Title Pill -->
      <div class="pointer-events-auto flex items-center gap-3 bg-slate-900/85 backdrop-blur-md border border-white/10 px-3.5 py-2 rounded-2xl shadow-2xl">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-emerald-400 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8M14 7h7v7" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="map-title" class="text-sm sm:text-base font-bold tracking-tight text-white leading-none">Tony's Land</h1>
            <span id="terrain-status-badge" class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
              3D Relief
            </span>
          </div>
          <p id="map-subtitle" class="text-[11px] text-slate-400 mt-1 leading-none">11 Tracks &bull; 13 Stands &amp; Gates &bull; Elev 502–938 ft</p>
        </div>
      </div>

      <!-- Mode Switcher & Camera Controls -->
      <div class="pointer-events-auto flex items-center gap-2">
        <!-- View Mode Segmented Control -->
        <div class="flex items-center bg-slate-900/85 backdrop-blur-md border border-white/10 p-1 rounded-2xl shadow-2xl">
          <button
            id="btn-mode-diorama"
            onclick="setRenderMode('diorama')"
            class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-emerald-500 text-slate-950 shadow-md"
          >
            3D Block
          </button>
          <button
            id="btn-mode-satellite"
            onclick="setRenderMode('satellite')"
            class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all text-slate-300 hover:text-white"
          >
            Satellite 3D
          </button>
        </div>

        <!-- Mobile Panel Toggle -->
        <button
          id="btn-toggle-panel"
          onclick="toggleSidebar()"
          class="bg-slate-900/85 hover:bg-slate-800 backdrop-blur-md border border-white/10 p-2.5 rounded-2xl text-slate-200 shadow-2xl transition"
          title="Toggle Controls & Legend"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ===================================================================== -->
    <!-- LEFT CONTROL & LEGEND DRAWER                                          -->
    <!-- ===================================================================== -->
    <aside
      id="sidebar-panel"
      class="absolute top-16 left-3 sm:top-20 sm:left-4 z-20 w-[calc(100vw-1.5rem)] max-w-[310px] max-h-[calc(100vh-12rem)] overflow-y-auto custom-scroll bg-slate-900/85 backdrop-blur-md border border-white/10 rounded-2xl p-4 shadow-2xl transition-all duration-200 space-y-4"
    >
      <!-- Quick Feature Selector -->
      <div>
        <label for="feature-select" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Inspect Road or Stand
        </label>
        <select
          id="feature-select"
          onchange="handleDropdownSelect(this.value)"
          class="w-full bg-slate-950/90 border border-white/15 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-400 transition"
        >
          <option value="">-- Overview (All Trails &amp; Stands) --</option>
        </select>
      </div>

      <!-- Color-Coded Road & Trail Legend / Toggles -->
      <div class="border-t border-white/10 pt-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Route Tiers &amp; Layers</span>
          <span class="text-[10px] text-slate-400">Toggle</span>
        </div>

        <div class="space-y-1.5 text-xs">
          <!-- Tier 1: Main Roads (Sunburst Yellow) -->
          <label class="flex items-center justify-between p-2 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer transition">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-1.5 rounded-full bg-[#FFE600] shadow-[0_0_8px_rgba(255,230,0,0.65)] inline-block shrink-0"></span>
              <div>
                <div class="font-semibold text-white leading-tight">Main Roads</div>
                <div class="text-[10px] text-slate-400">Shop, Big Valley, Big Ridge, Turkey, 171</div>
              </div>
            </div>
            <input type="checkbox" checked onchange="toggleLayer('main', this.checked)" class="accent-emerald-500 w-4 h-4 rounded cursor-pointer" />
          </label>

          <!-- Tier 2: Secondary / ATV (Vibrant Coral-Red) -->
          <label class="flex items-center justify-between p-2 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer transition">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-1.5 rounded-full bg-[#FF2E4C] shadow-[0_0_8px_rgba(255,46,76,0.65)] inline-block shrink-0"></span>
              <div>
                <div class="font-semibold text-white leading-tight">ATV / Secondary</div>
                <div class="text-[10px] text-slate-400">Logging, Crickey's, Loops &amp; Spurs</div>
              </div>
            </div>
            <input type="checkbox" checked onchange="toggleLayer('secondary', this.checked)" class="accent-emerald-500 w-4 h-4 rounded cursor-pointer" />
          </label>

          <!-- Waypoints: Stands, Gates & Shop -->
          <label class="flex items-center justify-between p-2 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer transition">
            <div class="flex items-center gap-2.5">
              <span class="w-6 flex justify-center">
                <span class="w-3 h-3 rounded-full bg-emerald-400 border-2 border-white inline-block"></span>
              </span>
              <div>
                <div class="font-semibold text-white leading-tight">Stands, Gates &amp; Shop</div>
                <div class="text-[10px] text-slate-400">13 Waypoints &amp; Labels</div>
              </div>
            </div>
            <input type="checkbox" checked onchange="toggleLayer('waypoints', this.checked)" class="accent-emerald-500 w-4 h-4 rounded cursor-pointer" />
          </label>
        </div>
      </div>

      <!-- 3D Terrain Controls -->
      <div id="diorama-controls" class="border-t border-white/10 pt-3 space-y-3">
        <!-- Vertical Exaggeration -->
        <div>
          <div class="flex items-center justify-between text-xs mb-1">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Terrain Relief</span>
            <span id="exag-value" class="font-mono text-emerald-400 font-semibold">1.8x</span>
          </div>
          <input
            id="exag-slider"
            type="range"
            min="0.5"
            max="3.0"
            step="0.1"
            value="1.8"
            oninput="updateExaggeration(this.value)"
            class="w-full"
          />
        </div>

        <!-- Surface Texture Style -->
        <div>
          <span class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Surface Layer</span>
          <div class="grid grid-cols-2 gap-1.5 text-xs">
            <button
              id="btn-tex-hybrid"
              onclick="setSurfaceStyle('hybrid')"
              class="py-1.5 px-2.5 rounded-xl font-medium border border-emerald-400/50 bg-emerald-500/20 text-emerald-200 transition"
            >
              Satellite + Contours
            </button>
            <button
              id="btn-tex-topo"
              onclick="setSurfaceStyle('topo')"
              class="py-1.5 px-2.5 rounded-xl font-medium border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 transition"
            >
              Hypsometric Topo
            </button>
          </div>
        </div>

        <!-- Camera Reset & Auto-Orbit -->
        <div class="flex items-center gap-2 pt-1">
          <button
            onclick="resetCamera()"
            class="flex-1 py-1.5 px-3 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-medium text-white transition"
          >
            Reset View
          </button>
          <button
            id="btn-auto-rotate"
            onclick="toggleAutoRotate()"
            class="py-1.5 px-3 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-medium text-slate-300 transition"
          >
            Spin: Off
          </button>
        </div>
      </div>

      <!-- Navigation Hint -->
      <div class="border-t border-white/10 pt-2.5 text-[10px] text-slate-400 flex items-center justify-between">
        <span>Drag: Orbit &bull; Right-Drag: Pan</span>
        <span>Scroll/Pinch: Zoom</span>
      </div>
    </aside>

    <!-- ===================================================================== -->
    <!-- BOTTOM ELEVATION PROFILE & INSPECTOR CARD                             -->
    <!-- ===================================================================== -->
    <section
      id="inspector-drawer"
      class="hidden absolute bottom-3 left-3 right-3 sm:bottom-4 sm:left-4 sm:right-4 z-30 max-w-3xl mx-auto bg-slate-900/90 backdrop-blur-md border border-white/15 rounded-2xl p-3.5 sm:p-4 shadow-2xl transition-all"
    >
      <div class="flex items-start justify-between gap-3 mb-2">
        <div class="flex items-center gap-2.5">
          <span id="inspector-badge" class="w-3 h-3 rounded-full bg-[#FFE600] shrink-0"></span>
          <div>
            <div class="flex items-center gap-2">
              <h2 id="inspector-title" class="text-sm sm:text-base font-bold text-white leading-tight">Big Valley Road</h2>
              <span id="inspector-tier-pill" class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-white/10 text-slate-200">
                Main Road
              </span>
            </div>
            <p id="inspector-meta" class="text-xs text-slate-300 mt-0.5">
              Distance: 0.42 mi &bull; Elev: 590 ft – 633 ft &bull; Gain: +43 ft
            </p>
          </div>
        </div>

        <button
          onclick="clearSelection()"
          class="p-1.5 rounded-xl bg-white/5 hover:bg-white/15 text-slate-400 hover:text-white transition"
          title="Close Inspector"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Interactive Elevation Chart Container -->
      <div id="elevation-chart-wrapper" class="relative w-full h-24 sm:h-28 bg-slate-950/70 rounded-xl border border-white/10 overflow-hidden cursor-crosshair">
        <canvas id="elevation-canvas" class="w-full h-full block"></canvas>
        <div
          id="elevation-readout"
          class="pointer-events-none absolute top-2 right-2.5 text-[11px] font-mono bg-slate-900/90 border border-white/10 px-2 py-0.5 rounded-lg text-emerald-300 hidden"
        >
          0.00 mi &bull; 620 ft
        </div>
      </div>
    </section>

    <!-- ===================================================================== -->
